<!-- receiver-register.html -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Receiver Registration - Save and Serve</title>
    <link rel="stylesheet" href="style.css" />
    <style>
        .container {
            max-width: 400px;
            margin: 60px auto;
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            color: #388E3C;
        }

        form {
            display: flex;
            flex-direction: column;
        }

        input,
        button {
            padding: 12px;
            margin: 10px 0;
            border-radius: 8px;
            border: 1px solid #ccc;
        }

        button {
            background-color: #4CAF50;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background-color: #388E3C;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Receiver Registration</h1>
        <form id="receiverForm">
            <input type="text" id="receiverName" placeholder="Your Name" required />
            <input type="text" id="receiverPhone" placeholder="Phone Number" required />
            <input type="text" id="receiverAddress" placeholder="Address" required />
            <input type="text" id="ngoName" placeholder="NGO Name (optional)" />
            <button type="submit">Register & View Donations</button>
        </form>
    </div>

    <script>
        const form = document.getElementById("receiverForm");

        form.addEventListener("submit", function (e) {
            e.preventDefault();

            const receiverInfo = {
                name: document.getElementById("receiverName").value,
                phone: document.getElementById("receiverPhone").value,
                address: document.getElementById("receiverAddress").value,
                ngo: document.getElementById("ngoName").value
            };

            // Save receiver data in session
            sessionStorage.setItem("receiver", JSON.stringify(receiverInfo));

            // Redirect to receiver donation listing
            window.location.href = "receiver.html";
        });
    </script>
</body>

</html>
